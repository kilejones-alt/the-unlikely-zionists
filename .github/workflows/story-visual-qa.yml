name: Visual QA — all story chapters

on:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/story-layout-qa.cjs'
      - '.github/workflows/story-visual-qa.yml'
  workflow_dispatch:

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve exact committed website locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/uz-web.log 2>&1 &
          sleep 2
          curl -fsSI http://127.0.0.1:8765/ > /dev/null
      - name: Capture desktop, laptop, tablet and phone screenshots
        run: node tests/story-layout-qa.cjs
      - name: Save every screenshot and audit report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-layout-visual-qa
          path: visual-qa-screenshots/
          if-no-files-found: warn
