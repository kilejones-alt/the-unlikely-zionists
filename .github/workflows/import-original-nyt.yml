name: Import original source media without alteration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-original-nyt.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify exact original image
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from pathlib import Path
          import sys
          urls=[
            'https://pbs.twimg.com/media/F8uT3llW4AAxR3Y.jpg',
            'https://pbs.twimg.com/media/F8uT3llW4AAxR3Y?format=jpg&name=orig',
            'https://pbs.twimg.com/media/F8uT3llW4AAxR3Y?format=jpg&name=large',
          ]
          for url in urls:
            try:
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as res:
                data=res.read(2000000)
              print(url,'bytes:',len(data))
              if not data.startswith(bytes.fromhex('ffd8')) or not data.endswith(bytes.fromhex('ffd9')):
                continue
              # The original user-supplied screenshot is 900x773.
              # A higher-resolution original with the exact same aspect is acceptable;
              # no generated, reconstructed, or altered asset is allowed.
              i=2
              dimensions=None
              while i+10<len(data):
                if data[i]!=255:
                  i+=1
                  continue
                mark=data[i+1]
                i+=2
                if mark in (216,217,218): break
                if i+2>len(data):break
                size=int.from_bytes(data[i:i+2],'big')
                if 192<=mark<=195 and size>=7:
                  h=int.from_bytes(data[i+3:i+5],'big')
                  w=int.from_bytes(data[i+5:i+7],'big')
                  dimensions=(w,h)
                  break
                i+=size
              print('Decoded JPEG dimensions:',dimensions)
              if not dimensions or min(dimensions)<773 or abs(dimensions[0]/dimensions[1] - 900/773)>.004:
                continue
              Path('assets').mkdir(exist_ok=True)
              Path('assets/nyt-october-2023-original.jpg').write_bytes(data)
              break
            except Exception as ex:
              print(type(ex).__name__,str(ex)[:200])
          else:
            sys.exit('Exact original media not verifiable; no image has been added.')
          PY
      - name: Commit unchanged source
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add assets/nyt-october-2023-original.jpg
          git diff --cached --quiet || (git commit -m 'Add unchanged original newspaper screenshot' && git push)
